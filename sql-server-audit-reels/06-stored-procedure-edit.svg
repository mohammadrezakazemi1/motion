<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="06 — Tiny stored procedure change"><title>06 — Tiny stored procedure change</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142c49"/><stop offset="1" stop-color="#080f24"/></linearGradient><radialGradient id="glow"><stop stop-color="#38dfcb" stop-opacity=".4"/><stop offset="1" stop-color="#38dfcb" stop-opacity="0"/></radialGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter></defs><rect width="1080" height="1920" fill="url(#bg)"/><ellipse cx="540" cy="620" rx="650" ry="700" fill="url(#glow)"/><path d="M0 0 H1080 V1920 H0Z" fill="none" stroke="#38dfcb" stroke-opacity=".22" stroke-width="18"/><g opacity=".12" fill="#38dfcb"><circle cx="100" cy="170" r="6"/><circle cx="950" cy="230" r="9"/><circle cx="990" cy="1510" r="7"/><circle cx="80" cy="1700" r="8"/><path d="M0 180 L1080 0 V70 L0 250Z"/></g><rect x="45" y="220" width="990" height="1030" rx="36" fill="#07192c" stroke="#437b98" stroke-width="10"/><rect x="80" y="260" width="920" height="90" rx="16" fill="#1d3a58"/><circle cx="125" cy="305" r="14" fill="#ff6b69"/><circle cx="170" cy="305" r="14" fill="#ffc05b"/><circle cx="215" cy="305" r="14" fill="#45d7b6"/><text x="280" y="317" font-family="monospace" font-size="31" fill="#d5e5f4">dbo.CalculateTax.sql</text><g font-family="monospace" font-size="30"><g fill="#718eaa"><text x="105" y="430">01</text><text x="105" y="500">02</text><text x="105" y="570">03</text><text x="105" y="640">04</text><text x="105" y="710">05</text><text x="105" y="780">06</text><text x="105" y="850">07</text><text x="105" y="920">08</text><text x="105" y="990">09</text><text x="105" y="1060">10</text></g><g fill="#65dfca"><text x="175" y="430">CREATE PROCEDURE dbo.CalculateTax</text><text x="175" y="500">AS</text><text x="175" y="570">BEGIN</text><text x="175" y="640">  SELECT invoice_total,</text><text x="175" y="710">         tax_rate,</text></g><rect x="150" y="738" width="810" height="58" rx="8" fill="#8f3c4d" opacity=".8"/><text x="175" y="780" fill="#ffd8d4">       ROUND(amount * rate, 2) -- edited</text><g fill="#65dfca"><text x="175" y="850">  FROM dbo.Invoices;</text><text x="175" y="920">END</text></g></g><path d="M760 1200 L950 1200 950 1380 760 1380Z" fill="#f3bd5e"/><path d="M800 1240 L910 1240 M800 1280 L890 1280 M800 1320 L920 1320" stroke="#694a3c" stroke-width="10" stroke-linecap="round"/><g transform="translate(300 1380)"><path d="M-220 280 Q-250 60 -120 25 L120 25 Q250 60 220 280Z" fill="#2d6987"/><ellipse cy="-90" rx="120" ry="140" fill="#c98d6a"/><path d="M-120 -110 Q-110 -245 0 -240 Q120 -230 120 -90 L75 -130 0 -155 -75 -105Z" fill="#222b3d"/><circle cx="-38" cy="-90" r="10" fill="#20263c"/><circle cx="38" cy="-90" r="10" fill="#20263c"/><path d="M-30 -35 Q0 -20 30 -35" stroke="#79463c" stroke-width="9" fill="none"/></g><g transform="translate(650 1430) rotate(-10)"><path d="M0 0 Q100 -60 200 0 L160 190 Q100 240 40 190Z" fill="#d7a078"/><path d="M35 30 L175 30 M45 70 L165 70 M55 110 L155 110" stroke="#a36d55" stroke-width="12" stroke-linecap="round"/></g><rect x="30" y="30" width="1020" height="1860" rx="32" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/></svg>